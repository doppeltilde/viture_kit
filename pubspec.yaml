name: viture_kit
description: "Native Dart FFI bindings for the VITURE XR Glasses SDK."
version: 0.2.0
homepage: "https://www.viture.com/"
repository: "https://github.com/doppeltilde/viture_kit"
license: BSD-3-Clause

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

platforms:
  macos:
  windows:
  android:
  web:

topics:
  - viture
  - xr
  - macos
  - ffi

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0
  code_assets: ^1.0.0
  hooks: ^1.0.3
  native_toolchain_c: ^0.17.6
  logging: ^1.3.0
  hidapi: ^0.1.5
  ffi: ^2.1.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0

flutter:
  assets:
    - assets/glasses.js
    - assets/glasses.wasm
    - assets/glasses-api.js