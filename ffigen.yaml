# Run with `dart run ffigen --config ffigen.yaml`.
name: VitureKitBindings
description: 'Bindings for VITURE XR Glasses C SDK and Custom Bridge'
output: 'lib/viture_kit_bindings_generated.dart'

ignore-source-errors: true

headers:
  entry-points:
    - 'src/include/viture_glasses_provider.h'
    - 'src/include/viture_device.h'
    - 'src/include/viture_device_carina.h'
    - 'src/include/viture_version.h'
    - 'src/include/viture_protocol_public.h'
  include-directives:
    - 'src/include/*.h'

compiler-opts:
  - '-Isrc/include'
  - '-include stdint.h'
  - '-include stdbool.h'

comments:
  style: any
  length: full

functions:
  include:
    - 'xr_.*'
    - 'GetVersionString'
structs:
  include:
    - 'xr_.*'
    - 'Viture.*'
enums:
  include:
    - 'xr_.*'